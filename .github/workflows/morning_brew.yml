name: Morning Brew — Daily Dan Commentary

on:
  schedule:
    # Primary: 03:00 ET = 08:00 UTC. Moved from 06:00 ET to avoid peak Gemini demand.
    - cron: '0 8 * * *'
    # Safety nets: each runs only if no fresh content has been published for today yet
    # (see "Skip if already published" step below), so successful days short-circuit in
    # seconds. The slots are spread across the morning/midday because a transient Gemini
    # demand/quota spike can last 1–2h — independent, widely-spaced attempts are the only
    # thing that reliably rides one out (a single run's in-process backoff cannot). Note:
    # GitHub's scheduler can delay a scheduled run by hours, so these are best-effort times.
    - cron: '30 9 * * *'   # 04:30 ET
    - cron: '0 11 * * *'   # 06:00 ET
    - cron: '0 13 * * *'   # 08:00 ET
    - cron: '0 15 * * *'   # 10:00 ET
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if today''s content is already published'
        type: boolean
        required: false
        default: false
      as_of_date:
        description: >-
          Pin the run to a specific day (YYYY-MM-DD). Every fetcher recaps the day
          BEFORE this one. Leave blank for the current UTC date. Set it when
          re-running a past day: without it each stage re-derives "today" from the
          wall clock, so an afternoon re-run can pick up a game that finished after
          the original run.
        type: string
        required: false
        default: ''

# Serialize overlapping runs instead of letting them race each other to git push.
concurrency:
  group: morning-brew
  cancel-in-progress: false

jobs:
  daily_pipeline:
    name: Generate and publish Boston Dan commentary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write

    env:
      # Blank means "use the current UTC date" — pipeline_dates.as_of_date()
      # ignores an empty value. Set via workflow_dispatch to replay a past day.
      AS_OF_DATE: ${{ inputs.as_of_date }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Skip if today's content already published
        id: freshness
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          if os.environ.get("FORCE", "").lower() == "true":
              print("force=true — bypassing freshness check")
              sys.exit(0)

          p = Path("docs/data/daily_output.json")
          if not p.exists():
              print("no existing output — proceeding")
              sys.exit(0)
          try:
              data = json.loads(p.read_text())
          except Exception as e:
              print(f"existing output unparseable ({e}) — proceeding")
              sys.exit(0)

          # Which day is the published post ABOUT? publish.py stamps `date` from
          # as_of_iso(). generated_at is the wall clock when the run FINISHED, and
          # the two part company on any replay or any run that crosses midnight
          # UTC. Reading generated_at cost the whole of 2026-09-11: run #615
          # replayed 09-10 at 03:34 UTC on the 11th, this gate read that timestamp
          # as "the 11th is already published", and runs #616-#620 each skipped in
          # nine seconds. The day never ran, and the site served Thursday's brew
          # under a Friday date line until someone noticed the archive pill missing.
          published_day = data.get("date")
          if not published_day:
              gen_at = data.get("generated_at")
              if not gen_at:
                  print("no date or generated_at on existing output — proceeding")
                  sys.exit(0)
              try:
                  dt = datetime.fromisoformat(gen_at)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
              except Exception as e:
                  print(f"bad generated_at ({e}) — proceeding")
                  sys.exit(0)
              published_day = dt.date().isoformat()
              print(f"no date stamp (payload predates it) — falling back to generated_at: {published_day}")

          # The day this run is FOR, so a pinned replay is judged against the day it
          # replays rather than against the wall clock.
          as_of = os.environ.get("AS_OF_DATE", "").strip()
          today_utc = as_of or datetime.now(timezone.utc).date().isoformat()
          if published_day == today_utc and not data.get("_stale") and not data.get("_fallback"):
              # Already have a real publish for today. Signal downstream steps to skip.
              # Must be an explicit close/flush: the previous `.open("a").write(...)`
              # left the handle to interpreter-shutdown GC, so a dropped write made
              # skip empty and the run regenerated the whole day instead of exiting
              # in ~9s (2026-07-24 16:14 UTC ran the full pipeline for 15 minutes).
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
                  fh.write("skip=true\n")
                  fh.flush()
                  os.fsync(fh.fileno())
              print(f"{today_utc} already published — skipping")
          else:
              print(f"existing output is for {published_day} (this run is for {today_utc}) — proceeding")
          PY

      - name: Set up Python 3.14
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python3 -m pip install --upgrade pip
          # Pinned: this is the only third-party dependency the daily pipeline
          # has, and it was installed unpinned on every production run until
          # 2026-09-04 — a breaking release would have shipped straight into
          # the morning brew. Bump deliberately, not by accident.
          pip install "google-genai==2.22.0" pydantic

      - name: Fetch NBA games
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_nba.py

      - name: Fetch NHL games
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_nhl.py

      - name: Fetch MLB games
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_mlb.py

      - name: Fetch NFL games
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_nfl.py

      - name: Fetch draft picks (all 4 teams)
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Same posture as the roster step below.
        run: |
          python3 scripts/fetch_draft.py \
            || echo "::warning::draft fetch degraded — draft freshness unavailable (see log)"

      - name: Fetch current rosters (all 4 teams)
        if: steps.freshness.outputs.skip != 'true'
        # A total roster outage must be visible but must not cost the day's post:
        # the file is still empty-but-valid, and judge rule 11 now skips per-team
        # rather than reading an unreachable roster as proof a player is off it.
        # Silence is what let three 403'd ESPN rosters ride a green pipeline.
        run: |
          python3 scripts/fetch_roster.py \
            || echo "::warning::roster fetch degraded — rule 11 skips affected teams (see log)"

      - name: Update scoreboard store
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_store.py

      - name: Fetch game schedule
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_schedule.py

      - name: Fetch latest news
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_news.py

      - name: Fetch season memory (current-season standings)
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_season_memory.py

      - name: Generate Dan commentary
        if: steps.freshness.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_rant.py

      - name: Publish output (with safety gate + fallback)
        if: steps.freshness.outputs.skip != 'true'
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # publish.py runs safety_judge.py internally and owns all fallback logic.
          # Exit 0 = something was written (fresh, stale-recent, or safe fallback).
          python3 scripts/publish.py

      - name: Health check
        if: steps.freshness.outputs.skip != 'true'
        run: python3 scripts/healthcheck.py

      - name: Detect what was published
        if: steps.freshness.outputs.skip != 'true'
        id: kind
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("docs/data/daily_output.json").read_text())
          if data.get("_fallback"):
              kind = "fallback"
          elif data.get("_stale"):
              kind = "stale"
          else:
              kind = "fresh"
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(f"kind={kind}\n")
          print(f"published kind: {kind}")
          PY

      - name: Commit and push changes (retry loop)
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: daily Dan output for $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            # Clean up any stuck rebase from a prior attempt. Without this, a
            # conflict on attempt 1 leaves the tree mid-rebase, and attempts 2+3
            # bail with "Pulling is not possible because you have unmerged files".
            git rebase --abort 2>/dev/null || true
            # -X theirs during rebase: when our local commit conflicts with
            # origin/main on docs/data/daily_output.json (the only file likely
            # to conflict), our content wins. Semantically correct — our run
            # produced the latest deterministic pipeline output.
            if git pull --rebase -X theirs origin main && git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "::error::git push failed after 3 attempts"
          exit 1

      - name: Summary
        if: success() && steps.freshness.outputs.skip != 'true'
        run: |
          kind="${{ steps.kind.outputs.kind }}"
          if [ "$kind" = "fresh" ]; then
            echo "✅ Morning Brew pipeline completed successfully (fresh content)"
          elif [ "$kind" = "stale" ]; then
            echo "::warning::Morning Brew published stale (yesterday's) content — generation failed but site is still readable"
          elif [ "$kind" = "fallback" ]; then
            echo "::warning::Morning Brew published SAFE_FALLBACK — nothing recoverable"
          fi
          echo "📍 Published: docs/data/daily_output.json"

      - name: Skip summary
        if: steps.freshness.outputs.skip == 'true'
        run: echo "✅ Skipped — today's content already published"

      - name: Open/update degraded-publish issue (stale or fallback)
        # A stale/fallback republish keeps the workflow green (intended graceful
        # degradation), so the failure() issue step below never fires for it. Without
        # this, a day of stale content is silently invisible. Surface it as an issue so
        # someone can re-trigger with force=true once Gemini recovers. Runs after a
        # successful push so a push failure (which fires the failure() issue) doesn't
        # also create a duplicate degraded issue.
        if: success() && steps.freshness.outputs.skip != 'true' && (steps.kind.outputs.kind == 'stale' || steps.kind.outputs.kind == 'fallback')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kind="${{ steps.kind.outputs.kind }}"
          title="Morning Brew degraded ($kind): $(date +%Y-%m-%d)"
          body="The pipeline published **$kind** content instead of fresh commentary — generation did not succeed (usually a transient Gemini 429/503 spike).

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Event: ${{ github.event_name }}
          Attempt: ${{ github.run_attempt }}

          The site is still readable (showing the most recent good content). If Gemini has recovered, re-run with:
          \`gh workflow run \"Morning Brew — Daily Dan Commentary\" --ref main -f force=true\`

          Later safety-net cron slots will also retry automatically."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "pipeline-degraded" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Open/update failure issue
        # cancelled() as well as failure(): a job GitHub *cancels* (infra
        # preemption, concurrency eviction, manual stop) does not satisfy
        # failure(), so the 2026-07-24 16:14 UTC cancellation filed no issue and
        # was invisible to alerting despite showing red. Logs for cancelled runs
        # also expire fast, so capture the status in the issue while it exists.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Morning Brew failed: $(date +%Y-%m-%d)"
          body="Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Event: ${{ github.event_name }}
          Attempt: ${{ github.run_attempt }}
          Job status: ${{ job.status }}

          See run logs for details."
          # Try to find an existing open issue with today's title; if none, create one.
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "pipeline-failure" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Failure summary
        if: failure()
        run: |
          echo "::error::Morning Brew pipeline failed"
          echo "📍 Check logs above for details"
          exit 1
