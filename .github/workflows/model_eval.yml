name: Model Eval — A/B open models vs Gemini

# Manual-only. Runs scripts/eval_models.py against either a fixture or today's
# REAL data through several models (Gemini baseline + Gemma open models, all via
# the same GEMINI_API_KEY), prints a comparison table + voice preview to the run
# summary, and uploads the per-model JSON outputs as an artifact. This is a
# dev/eval tool — it does NOT touch the site, commit anything, or affect the
# daily pipeline.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = today''s real data; fixture = a fixture; list = list callable model ids'
        type: choice
        required: true
        default: 'live'
        options:
          - live
          - fixture
          - list
      fixture:
        description: 'Fixture path (fixture mode only)'
        type: string
        required: false
        default: 'evals/fixtures/voice_rivalry.json'
      models:
        description: 'Comma-separated model ids to compare'
        type: string
        required: true
        default: 'gemini-3.1-flash-lite,gemma-3-27b-it,gemma-3-12b-it'
      n:
        description: 'Generations per model (keep small — free-tier rate limits)'
        type: string
        required: true
        default: '2'
      debug:
        description: 'Verbose model diagnostics (finish_reason + raw response on failure)'
        type: boolean
        required: false
        default: false

# Read-only eval; multiple manual runs may overlap harmlessly.
permissions:
  contents: read

jobs:
  eval:
    name: Run model comparison eval
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install google-genai pydantic

      - name: Fetch today's real data (live mode)
        if: inputs.mode == 'live'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Same fetch/build steps as the daily pipeline — populates data/*.json
          # with today's real data so the models generate against the real inputs.
          # No generation/judge/publish here; the eval drives generation itself.
          set -e
          python3 scripts/fetch_nba.py
          python3 scripts/fetch_nhl.py
          python3 scripts/fetch_mlb.py
          python3 scripts/fetch_nfl.py
          python3 scripts/fetch_draft.py
          python3 scripts/fetch_roster.py
          python3 scripts/update_store.py
          python3 scripts/fetch_schedule.py
          python3 scripts/fetch_news.py
          python3 scripts/fetch_season_memory.py

      - name: Run model eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
          FIXTURE: ${{ inputs.fixture }}
          MODELS: ${{ inputs.models }}
          N: ${{ inputs.n }}
          LLM_DEBUG_RAW: ${{ inputs.debug && '1' || '' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "list" ]; then
            python3 scripts/eval_models.py --list-models | tee eval_output.txt
            title="list — callable model ids"
          elif [ "$MODE" = "live" ]; then
            python3 scripts/eval_models.py --live --n "$N" --models "$MODELS" | tee eval_output.txt
            title="live — today's real data"
          else
            python3 scripts/eval_models.py --fixture "$FIXTURE" --n "$N" --models "$MODELS" | tee eval_output.txt
            title="fixture — $(basename "$FIXTURE")"
          fi
          {
            echo "## Model eval — $title"
            echo ""
            echo "Models: \`$MODELS\` · n=$N"
            echo ""
            echo '```'
            cat eval_output.txt
            echo '```'
            echo ""
            echo "_Download the **eval-outputs** artifact for the full per-model JSON — the table and preview above are only triage._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-outputs
          path: |
            evals/runs/**
            !evals/runs/*_tmp/**
          if-no-files-found: warn
