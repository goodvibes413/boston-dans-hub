name: Tests

# Unit tests for the deterministic pipeline pieces plus a DRY_RUN prompt-assembly
# smoke test. Exists because the rolling-store structure bug shipped broken for a
# month in June 2026 — nothing exercised the pre-pass functions before production.
# No API key needed: tests never call Gemini, and DRY_RUN exits before any LLM call.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'prompts/**'
      - 'tests/**'
      - 'requirements*'
      - 'security-constraints.txt'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Verify locked dependencies
        run: |
          python3 -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip check

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Prompt-assembly smoke test (DRY_RUN)
        run: |
          DRY_RUN=1 python3 scripts/generate_rant.py > /tmp/prompt.txt
          # The assembled prompt must contain the core data blocks
          grep -q "ROLLING_7DAY" /tmp/prompt.txt
          grep -q "SEASON_MEMORY" /tmp/prompt.txt
          # GAMES_TODAY is emitted either way — the "none" branch is what says
          # nobody plays today, and a CI run has no fetched schedule at all.
          grep -q "GAMES_TODAY" /tmp/prompt.txt
          # YESTERDAY is the coverage window's anchor; it must always be named.
          grep -q "YESTERDAY:" /tmp/prompt.txt
          echo "prompt assembled OK ($(wc -c < /tmp/prompt.txt) bytes)"

      - name: Compile all scripts
        run: python3 -m py_compile scripts/*.py
